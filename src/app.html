<!doctype html>
<html lang="en" class="dark" data-color-mode="dark" style="color-scheme: dark;">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			try {
				const m = localStorage.getItem('portfolio_color_mode');
				if (m === 'light') {
					document.documentElement.classList.remove('dark');
					document.documentElement.classList.add('light');
					document.documentElement.setAttribute('data-color-mode', 'light');
					document.documentElement.style.colorScheme = 'light';
				} else {
					document.documentElement.classList.add('dark');
					document.documentElement.classList.remove('light');
					document.documentElement.setAttribute('data-color-mode', 'dark');
					document.documentElement.style.colorScheme = 'dark';
				}
			} catch (e) {}
		</script>
		<link rel="icon" type="image/png" href="/favicon.png" />
		<link rel="apple-touch-icon" href="/favicon.png" />
		<link
			rel="preload"
			href="/fonts/SymbolsNerdFont-Regular.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Kalam:wght@300;400;700&family=Geist+Mono:wght@300..700&family=Space+Grotesk:wght@300..700&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=satoshi@400,500,700&display=swap"
			rel="stylesheet"
		/>
		<link rel="preconnect" href="https://api.web3forms.com" />
		<link rel="dns-prefetch" href="https://api.web3forms.com" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
